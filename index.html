<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Smart Bin Dashboard</title>
  <style>
    /* ... Tes styles restent identiques ... */
    body { margin: 0; font-family: Arial, sans-serif; display: flex; height: 100vh; overflow: hidden; }
    header { position: absolute; width: 100%; top: 0; padding: 10px 20px; background-color: #1e88e5; color: white; text-align: center; z-index: 1; }
    .sidebar { width: 300px; background-color: #f0f0f0; padding: 60px 20px 20px; display: flex; flex-direction: column; }
    .map { flex: 1; padding-top: 60px; }
    iframe { width: 100%; height: 100%; border: none; }
    button { width: 100%; padding: 10px; background-color: #1e88e5; color: white; border: none; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <header>♻️ Smart Bin Dashboard</header>

  <div class="sidebar">
    <h3>Contrôle de la Tournée</h3>
    
    <label for="strategy">Stratégie d'optimisation :</label>
    <select id="strategy" onchange="updateMap()">
      <option value="distance">Distance la plus courte</option>
      <option value="fill_level">Priorité au remplissage</option>
    </select>

    <button onclick="updateMap()">🔄 Rafraîchir la carte</button>
    
    <div id="log" style="margin-top: 10px; font-size: 0.8rem;"></div>
  </div>

  <div class="map">
    <iframe id="mapFrame"></iframe>
  </div>

  <script>
    // ⚠️ CHANGE CETTE URL PAR TON ADRESSE HTTPS NGROK OU AZURE
    const BASE_URL = "https://becoming-oarfish-luckily.ngrok-free.app";

    function updateMap() {
      const strategy = document.getElementById("strategy").value;
      const mapFrame = document.getElementById("mapFrame");
      const log = document.getElementById("log");

      // Construction de l'URL finale
      const finalUrl = `${BASE_URL}/map?strategy=${strategy}`;
      
      mapFrame.src = finalUrl;
      log.innerText = "Dernière mise à jour : " + new Date().toLocaleTimeString();
      log.style.color = "blue";
    }

    // Chargement initial
    window.onload = updateMap;
  </script>
</body>
</html>
