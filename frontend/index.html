<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GreenTech SmartBin — Dashboard</title>
  <meta name="description" content="Tableau de bord intelligent pour la gestion des déchets urbains — GreenTech SmartBin AIoT" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♻️</text></svg>" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- ═══ Top Navigation ═══ -->
  <nav class="topnav" id="topnav">
    <div class="topnav__brand">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
        <circle cx="14" cy="14" r="13" stroke="#10b981" stroke-width="2"/>
        <path d="M9 14l3 3 7-7" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>GreenTech <span class="topnav__brand-accent">SmartBin</span></span>
    </div>
    <div class="topnav__actions">
      <div class="topnav__status">
        <div class="topnav__status-dot"></div>
        Système en ligne
      </div>
      <div class="topnav__badge" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="topnav__badge-dot"></div>
      </div>
    </div>
  </nav>

  <!-- ═══ Sidebar ═══ -->
  <aside class="sidebar" id="sidebar">

    <!-- Strategy Toggle -->
    <div class="sidebar__section">
      <div class="sidebar__title">Stratégie de Route</div>
      <div class="strategy-toggle">
        <button class="strategy-toggle__btn active" data-strategy="fill_level">⚡ Priorité Remplissage</button>
        <button class="strategy-toggle__btn" data-strategy="distance">📍 Distance Min</button>
      </div>

      <div class="route-info">
        <div class="route-info__item">
          <div class="route-info__value" id="route-distance">—</div>
          <div class="route-info__label">Distance</div>
        </div>
        <div class="route-info__item">
          <div class="route-info__value" id="route-duration">—</div>
          <div class="route-info__label">Durée</div>
        </div>
        <div class="route-info__item">
          <div class="route-info__value" id="route-stops">—</div>
          <div class="route-info__label">Arrêts</div>
        </div>
        <div class="route-info__item">
          <div class="route-info__value" id="route-saved">—</div>
          <div class="route-info__label">Économisé</div>
        </div>
      </div>
    </div>

    <!-- Bin List -->
    <div class="sidebar__section" style="flex:1; overflow:hidden; padding-bottom:0;">
      <div class="sidebar__title">Poubelles Connectées</div>
      <div class="bin-list" id="bin-list">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Update Panel -->
    <div class="sidebar__section update-panel">
      <div class="sidebar__title">Mise à Jour Manuelle</div>
      <form id="update-form">
        <label for="bin-select">Poubelle</label>
        <select id="bin-select">
          <option value="1">Bin Agdal-01</option>
          <option value="2">Bin Hay Riad-02</option>
          <option value="3">Bin Souissi-03</option>
          <option value="4">Bin Médina-04</option>
          <option value="5">Bin Hassan-05</option>
        </select>

        <label>Niveau de remplissage</label>
        <div class="slider-wrapper">
          <input type="range" id="fill-slider" min="0" max="100" value="50" />
          <span class="slider-value" id="slider-value">50%</span>
        </div>

        <button type="submit" class="btn-primary">📡 Envoyer la mise à jour</button>
      </form>
      <div class="update-log" id="update-log"></div>
    </div>
  </aside>

  <!-- ═══ Main Content ═══ -->
  <main class="main">
    <div id="map"></div>

    <!-- KPI Strip -->
    <div class="kpi-strip">
      <div class="kpi-card fade-in">
        <div class="kpi-card__icon green">🗑️</div>
        <div>
          <div class="kpi-card__value" id="kpi-total">—</div>
          <div class="kpi-card__label">Poubelles Total</div>
        </div>
      </div>
      <div class="kpi-card fade-in">
        <div class="kpi-card__icon red">⚠️</div>
        <div>
          <div class="kpi-card__value" id="kpi-critical">—</div>
          <div class="kpi-card__label">Critiques</div>
        </div>
      </div>
      <div class="kpi-card fade-in">
        <div class="kpi-card__icon blue">🛣️</div>
        <div>
          <div class="kpi-card__value" id="kpi-distance">—</div>
          <div class="kpi-card__label">Route Optimisée</div>
        </div>
      </div>
      <div class="kpi-card fade-in">
        <div class="kpi-card__icon green">🌿</div>
        <div>
          <div class="kpi-card__value" id="kpi-co2">—</div>
          <div class="kpi-card__label">CO₂ Économisé</div>
        </div>
      </div>
    </div>

    <!-- Charts Panel -->
    <div class="charts-panel fade-in">
      <div class="charts-panel__header">
        <span class="charts-panel__title">📊 Analyses</span>
        <button class="charts-panel__toggle" id="charts-toggle">▼</button>
      </div>
      <div class="charts-panel__body">
        <div class="chart-tabs">
          <button class="chart-tab active" data-tab="trend">Tendance</button>
          <button class="chart-tab" data-tab="distribution">Distribution</button>
          <button class="chart-tab" data-tab="efficiency">Par Bin</button>
        </div>
        <div class="chart-container">
          <canvas id="main-chart"></canvas>
        </div>
      </div>
    </div>
  </main>

</div>

<script src="app.js"></script>
</body>
</html>
