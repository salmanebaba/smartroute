services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - appnet

  osrm:
    build:
      context: ./osrm
    volumes:
      - ./maps:/data
    ports:
      - "5000:5000"
    networks:
      - appnet

  frontend:
    build:
      context: ./frontend
      args:
        # Tell Vite to point to the Nginx proxy path
        - VITE_API_URL=/api
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - appnet

  ngrok:
    image: ngrok/ngrok
    depends_on:
      - backend
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}  # Pass your ngrok token here
    command: http backend:8000 --domain=becoming-oarfish-luckily.ngrok-free.app
    networks:
      - appnet

networks:
  appnet: